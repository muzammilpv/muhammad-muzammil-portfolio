<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="oudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#191309"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c98a2e"/>
      <stop offset="50%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#8c5906"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#oudBg)"/>
  <circle cx="600" cy="337" r="320" fill="url(#goldGlow)"/>

  <!-- Luxury Bottle Graphic -->
  <g transform="translate(600, 360)">
    <!-- Reflection / Base -->
    <ellipse cx="0" cy="180" rx="140" ry="25" fill="#120e08" stroke="#c98a2e" stroke-width="1"/>

    <!-- Glass Body -->
    <rect x="-110" y="-80" width="220" height="240" rx="12" fill="#140f09" stroke="url(#goldCap)" stroke-width="3"/>
    <rect x="-90" y="-60" width="180" height="200" rx="8" fill="#1d160c" opacity="0.9"/>
    
    <!-- Label -->
    <rect x="-70" y="0" width="140" height="90" fill="#050505" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="35" fill="#ffb84d" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" letter-spacing="3" text-anchor="middle">LUXURY</text>
    <text x="0" y="60" fill="#f5f2ea" font-family="'Syne', sans-serif" font-weight="800" font-size="20" letter-spacing="4" text-anchor="middle">OUD</text>
    <text x="0" y="75" fill="#a7a39a" font-family="sans-serif" font-size="8" letter-spacing="2" text-anchor="middle">EXTRAIT DE PARFUM</text>

    <!-- Metallic Cap -->
    <rect x="-45" y="-140" width="90" height="60" rx="4" fill="url(#goldCap)"/>
    <rect x="-55" y="-80" width="110" height="12" rx="2" fill="#f59e0b"/>
  </g>

  <!-- Typography Overlay -->
  <text x="600" y="110" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" letter-spacing="6" text-anchor="middle">CINEMATIC PRODUCT ADVERTISEMENT</text>
  <text x="600" y="160" fill="#f5f2ea" font-family="'Syne', sans-serif" font-weight="900" font-size="44" letter-spacing="4" text-anchor="middle">LUXURY OUD / ATTAR</text>
</svg>
